<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust | Explore The World</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="landing-body">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3" style="top: 50%; left: 30%; background: radial-gradient(circle, #e879f9 0%, rgba(232,121,249,0) 70%);"></div>

    <nav class="landing-nav glass-panel">
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-plane-departure"></i></div>
            <h1 style="margin-bottom:0">Wanderlust</h1>
        </div>
        <div class="nav-actions">
            <a href="auth.html?mode=login" class="nav-link">Log In</a>
            <a href="auth.html?mode=register" class="primary-btn nav-btn">Sign Up Free</a>
        </div>
    </nav>

    <header class="hero-section">
        <h1 class="hero-title">Discover The Extraordinary</h1>
        <p class="hero-subtitle">Plan your perfect trip with Wanderlust. Manage timelines, explore premium destinations, and build a world-class itinerary.</p>
        <div class="hero-cta">
            <a href="auth.html?mode=register" class="primary-btn hero-btn">Start Exploring <i class="fa-solid fa-arrow-right"></i></a>
        </div>
    </header>

    <main class="destinations-section">
        <h2 class="section-title">Popular Destinations Around the Globe</h2>
        <div id="destinations-grid" class="trip-grid destinations-grid">
            <!-- Destinations will map here via JS -->
            <div style="text-align:center;width:100%;"><i class="fa-solid fa-spinner fa-spin"></i> Loading premium destinations...</div>
        </div>
    </main>

    <script src="scripts/backend.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (MockBackend.getCurrentUser()) {
                document.querySelector('.nav-actions').innerHTML = `<a href="dashboard.html" class="primary-btn nav-btn">Go to Planner Dashboard <i class="fa-solid fa-arrow-right"></i></a>`;
            }

            const grid = document.getElementById('destinations-grid');
            try {
                const places = await MockBackend.getTopDestinations();
                grid.innerHTML = '';
                places.forEach(place => {
                    const card = document.createElement('div');
                    card.className = 'destination-card glass-panel';
                    card.innerHTML = `
                        <div class="dest-image" style="background-image: url('${place.image}')">
                            <span class="dest-badge">${place.type}</span>
                        </div>
                        <div class="dest-content">
                            <h3>${place.name}</h3>
                            <p>${place.description}</p>
                            <a href="auth.html?mode=register" class="dest-btn">Plan a Trip Here <i class="fa-solid fa-plane"></i></a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch(e) {
                grid.innerHTML = '<p>Failed to load destinations.</p>';
            }
        });
    </script>
</body>
</html>
