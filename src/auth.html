<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | Wanderlust</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="blob blob-1"></div>
    <div class="blob blob-2" style="background: radial-gradient(circle, #f43f5e 0%, rgba(244,63,94,0) 70%);"></div>

    <div class="auth-container glass-panel">
        <div class="logo flex-center" style="margin-bottom: 2rem;">
            <div class="logo-icon"><i class="fa-solid fa-plane-departure"></i></div>
            <h1 style="margin-bottom:0">Wanderlust</h1>
        </div>

        <h2 id="auth-title" class="auth-title">Welcome Back</h2>
        <p id="auth-desc" class="auth-desc">Log in to manage your world trips.</p>

        <form id="auth-form" class="auth-form">
            <div id="error-box" class="error-box hidden"></div>
            
            <div class="input-group auth-input">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Username" required>
            </div>
            
            <div class="input-group auth-input">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <button type="submit" id="auth-btn" class="primary-btn auth-submit-btn">
                <span>Sign In</span> <i id="auth-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
            </button>
        </form>

        <div class="auth-toggle">
            <span id="toggle-text">Don't have an account?</span> 
            <a href="#" id="toggle-link">Sign Up</a>
        </div>
    </div>

    <script src="scripts/backend.js"></script>
    <script src="scripts/auth.js"></script>
</body>
</html>
